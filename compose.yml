services:
  postgres:
    image: postgres:18.4-trixie
    container_name: postgres_container
    # Equal CPU/memory budget for every engine so the comparison is fair. GMT
    # honours the native compose `cpus`/`mem_limit` keys. Tune these to the
    # benchmark host; only one DB container is exercised per scenario (plus the
    # hammerdb driver, which is left unconstrained so it never bottlenecks the
    # load generation).
    cpus: 4
    mem_limit: 8g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # ports:
      # - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mariadb:
    image: mariadb:13.0.1-rc
    container_name: mariadb_container
    cpus: 4
    mem_limit: 8g
    environment:
      MYSQL_ROOT_PASSWORD: maria
      MYSQL_DATABASE: maria
      MYSQL_USER: maria
      MYSQL_PASSWORD: maria
    # ports:
      # - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mysql:
    image: mysql:9.7.1-oraclelinux9
    container_name: mysql_container
    cpus: 4
    mem_limit: 8g
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    # ports:
      # - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  oracle:
    image: container-registry.oracle.com/database/free:23.26.2.0
    container_name: oracle_container
    cpus: 4
    mem_limit: 8g
    environment:
      ORACLE_PWD: oracle
    # ports:
      # - "1521:1521"
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU23-ubuntu-22.04
    container_name: mssql_container
    cpus: 4
    mem_limit: 8g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Hammerdb_2024
      MSSQL_PID: Developer
    # ports:
      # - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  db2:
    # The Db2 client side runs in the hammerdb container via the `hammerdb-db2`
    # image, which must be built first with `./db/db2/build-image.sh`.
    image: icr.io/db2_community/db2:latest
    container_name: db2_container
    cpus: 4
    mem_limit: 8g
    # Db2 needs a privileged container. GMT has no `privileged` key, so it is
    # passed through as a raw docker run arg (allowed because of --allow-unsafe).
    docker-run-args:
      - "--privileged"
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: ibmdb2
      DBNAME: tpcc # overridden to tpch in the TPC-H scenario
    # ports:
      # - "50000:50000"
    healthcheck:
      test: ["CMD-SHELL", "su -l db2inst1 -c \"db2 connect to $DBNAME && db2 connect reset\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

# Benchmark drivers

  hammerdb:
    image: tpcorg/hammerdb:latest
    container_name: hammerdb_container

  benchbase:
    image: ribalba/benchbase:latest
    container_name: benchbase_container
