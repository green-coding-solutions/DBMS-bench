---
name: HammerDB Postgres benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks postgresql with HammerDB using TPC-C. Long running time series, see legacy/README.md before changing anything.

compose-file: !include legacy/compose.yml

custom_metrics:
  sqlop:
    unit: TPC-C SQL-op
    sci: true

services:
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  hammerdb: # wait for Postgres to accept connections before the flow starts
    depends_on:
      postgres:
        condition: service_healthy

# The three flow names are part of the time series (phase names in the dashboard and
# in the Energy ID software tasks). Keep them, and do not add or remove flow steps.
flow:
  - name: Build Warehouses
    container: hammerdb_container
    commands:
      # HammerDB exits 0 even when a virtual user dies mid-run, so the log is the only
      # place that failure shows up. GMT runs the shell with errexit/nounset/pipefail
      # and reports stdout/stderr when a command fails.
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/legacy/pg/pg_tprocc_buildschema.tcl 2>&1 | tee /tmp/hammerdb-build.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Query Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB SELECTS
        command: ./hammerdbcli auto /tmp/repo/legacy/pg/pg_tprocc_run.tcl 2>&1 | tee /tmp/hammerdb-run.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi; awk '/System achieved [0-9]+ NOPM/ { match($0, /System achieved [0-9]+ NOPM/); v=substr($0, RSTART+16, RLENGTH-21) } END { if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 sqlop=%s\n", ts, v) }' /tmp/hammerdb-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Warehouses
    container: hammerdb_container
    commands:
      # Not checked for failures on purpose. pg_tprocc_deleteschema.tcl connects to the
      # database it tries to drop, so HammerDB logs "cannot drop the currently open
      # database" and FINISHED FAILED. It has done so in every run since 2023 and that
      # is what this phase has always measured.
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/legacy/pg/pg_tprocc_deleteschema.tcl
        shell: bash
        log-stdout: true
