---
name: HammerDB MSSQL TPC-C benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Microsoft SQL Server with HammerDB using TPC-C

compose-file: !include compose.yml

custom_metrics:
  sqlop:
    unit: TPC-C SQL-op
    sci: true

services:
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  oracle: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  hammerdb: # wait for SQL Server to finish starting up before benchmarking
    depends_on:
      mssql:
        condition: service_healthy

flow:
  - name: Build Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB BUILD
        command: TMP=/tmp PATH=/opt/mssql-tools18/bin:$PATH ./hammerdbcli auto /tmp/repo/db/mssql/tpcc/mssql_tprocc_buildschema.tcl
        shell: sh
        log-stdout: true
  - name: Query Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB SELECTS
        command: ./hammerdbcli auto /tmp/repo/db/mssql/tpcc/mssql_tprocc_run.tcl > /tmp/hammerdb-run.log 2>&1; rc=$?; cat /tmp/hammerdb-run.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; awk '/System achieved [0-9]+ NOPM/ { match($0, /System achieved [0-9]+ NOPM/); v=substr($0, RSTART+16, RLENGTH-21) } END { if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 sqlop=%s\n", ts, v) }' /tmp/hammerdb-run.log
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/mssql/tpcc/mssql_tprocc_deleteschema.tcl
        shell: sh
        log-stdout: true
