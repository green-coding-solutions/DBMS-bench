---
name: HammerDB MySQL TPC-C benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks mysql with HammerDB using TPC-C

compose-file: !include compose.yml

custom_metrics:
  sqlop:
    unit: TPC-C SQL-op
    sci: true

services:
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the service
  oracle: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  hammerdb: # wait for MySQL to finish starting up before benchmarking
    depends_on:
      mysql:
        condition: service_healthy

flow:
  - name: Build Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpcc/mysql_tprocc_buildschema.tcl
        shell: sh
        log-stdout: true
  - name: Query Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB SELECTS
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpcc/mysql_tprocc_run.tcl > /tmp/hammerdb-run.log 2>&1; rc=$?; cat /tmp/hammerdb-run.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; awk '/System achieved [0-9]+ NOPM/ { match($0, /System achieved [0-9]+ NOPM/); v=substr($0, RSTART+16, RLENGTH-21) } END { if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 sqlop=%s\n", ts, v) }' /tmp/hammerdb-run.log
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpcc/mysql_tprocc_deleteschema.tcl
        shell: sh
        log-stdout: true
