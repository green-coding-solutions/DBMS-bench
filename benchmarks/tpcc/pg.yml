---
name: HammerDB Postgres TPC-C benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks postgresql with HammerDB using TPC-C

compose-file: !include compose.yml

custom_metrics:
  sqlop:
    unit: TPC-C SQL-op
    sci: true

services:
  postgres:
    # T2: workload-tuned for throughput, class oltp. Server parameters as command-line
    # arguments so they are in force from the first start; provenance in TIERS.md.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=2048MB"
      - "-c"
      - "effective_cache_size=6144MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "work_mem=8967kB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "min_wal_size=2GB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "huge_pages=try"
      - "-c"
      - "wal_compression=lz4"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      - "-c"
      - "jit=off"
  cockroach: # unused — empty key removes the service
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the service
  oracle: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  benchbase: # unused BenchBase driver removed so no idle container is measured
  hammerdb: # wait for Postgres to finish starting up before benchmarking
    depends_on:
      postgres:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: postgres_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T2 oltp, applied at container start through the command line above)
        command: psql -U postgres -v ON_ERROR_STOP=1 -Atf /tmp/repo/db/pg/tiers/configure.sql
        shell: bash
        log-stdout: true
  - name: Build Warehouses
    container: hammerdb_container
    commands:
      # HammerDB exits 0 even when a virtual user dies mid-run, so the log is the only
      # place that failure shows up. Nothing else needs handling: GMT runs the shell
      # with errexit/nounset/pipefail and reports stdout/stderr when a command fails.
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/pg/tpcc/pg_tprocc_buildschema.tcl 2>&1 | tee /tmp/hammerdb-build.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Warm up
    container: hammerdb_container
    commands:
      # The ramp-up is its own phase (2 min, no HammerDB-internal ramp-up) so that the
      # measured phase below contains only the timed 5 min window. GMT phase boundaries
      # are the only reliable timing source, so the split has to happen in the flow.
      - type: console
        note: RUN HAMMERDB WARM-UP
        command: ./hammerdbcli auto /tmp/repo/db/pg/tpcc/pg_tprocc_warmup.tcl 2>&1 | tee /tmp/hammerdb-warmup.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-warmup.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Run TPC-C
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB TPC-C (measured)
        command: ./hammerdbcli auto /tmp/repo/db/pg/tpcc/pg_tprocc_run.tcl 2>&1 | tee /tmp/hammerdb-run.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi; echo '=== HAMMERDB TIME PROFILE ==='; cat /tmp/hdbxtprofile.log || echo 'TIME PROFILE MISSING'; awk '/System achieved [0-9]+ NOPM/ { match($0, /System achieved [0-9]+ NOPM/); v=substr($0, RSTART+16, RLENGTH-21) } END { if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 sqlop=%s\n", ts, v) }' /tmp/hammerdb-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Warehouses
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/pg/tpcc/pg_tprocc_deleteschema.tcl
        shell: bash
        log-stdout: true
