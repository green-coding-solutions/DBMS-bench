---
name: BenchBase PostgreSQL YCSB benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks PostgreSQL with BenchBase using the YCSB workload

compose-file: !include compose.yml

custom_metrics:
  ycsb_requests: # functional unit (work done): BenchBase requests completed in the measured run
    unit: YCSB request
    sci: true

services:
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      postgres:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: postgres_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: psql "postgresql://postgres:postgres@localhost:5432/postgres" -tc "SELECT 1 FROM pg_database WHERE datname='benchbase'" | grep -q 1 || psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE benchbase"
        shell: sh
        log-stdout: true
  - name: Load YCSB schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD
        command: cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b ycsb -c /tmp/repo/db/pg/ycsb/pg_ycsb_config.xml --create=true --load=true --execute=false
        shell: sh
        log-stdout: true
  - name: Run YCSB workload
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE
        command: rc=0; cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b ycsb -c /tmp/repo/db/pg/ycsb/pg_ycsb_config.xml --create=false --load=false --execute=true > /tmp/benchbase-run.log 2>&1 || rc=$?; cat /tmp/benchbase-run.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 ycsb_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: sh
        log-stdout: true
        read-sci-stdout: true
