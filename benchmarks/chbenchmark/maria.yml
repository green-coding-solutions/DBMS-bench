---
name: BenchBase MariaDB CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin)
description: Benchmarks MariaDB with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  postgres: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      mariadb:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: mariadb_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: mariadb -uroot -pmaria -e "CREATE DATABASE IF NOT EXISTS benchbase; GRANT ALL ON benchbase.* TO 'maria'@'%'; FLUSH PRIVILEGES;"
        shell: sh
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-mariadb && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/maria/chbenchmark/maria_chbenchmark_config.xml --create=true --load=true --execute=false
        shell: sh
        log-stdout: true
  - name: Run CH-benCHmark HTAP workload
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE
        command: cd /benchbase/benchbase-mariadb && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/maria/chbenchmark/maria_chbenchmark_config.xml --create=false --load=false --execute=true | tee /dev/stderr | awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v!="") {"date +%s"|getline ts; printf("%s000000 chbenchmark_requests=%s\n", ts, v)}}'
        shell: sh
        log-stdout: true
        read-sci-stdout: true
