services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    # Equal CPU/memory budget for every engine so the comparison is fair. GMT
    # honours the native compose `cpus`/`mem_limit` keys. Tune these to the
    # benchmark host; only one DB container is exercised per scenario (plus the
    # hammerdb driver, which is left unconstrained so it never bottlenecks the
    # load generation).
    cpus: 4
    mem_limit: 8g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # ports:
      # - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mariadb:
    image: mariadb:latest
    container_name: mariadb_container
    cpus: 4
    mem_limit: 8g
    environment:
      MYSQL_ROOT_PASSWORD: maria
      MYSQL_DATABASE: maria
      MYSQL_USER: maria
      MYSQL_PASSWORD: maria
    # ports:
      # - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mysql:
    # On `:latest` like every other engine (currently MySQL 26.7). The old
    # `--mysql-native-password=ON --authentication-policy=...` command is gone: on 9.x+ it
    # is an unknown variable and the server aborts on startup.
    #
    # MySQL 9.0 removed mysql_native_password, so every account is caching_sha2_password,
    # which refuses to authenticate over a plaintext connection:
    #     Authentication plugin 'caching_sha2_password' reported error:
    #     Authentication requires secure connection.
    # That kills HammerDB, whose bundled mysqltcl has no RSA key-exchange path
    # (no --get-server-public-key). BenchBase is unaffected — JDBC negotiates it fine.
    #
    # The fix is the setup-commands below, and it costs us nothing in comparability.
    # caching_sha2_password has a *fast path*: once the server holds the password in its
    # cache, later connections for that account authenticate over plaintext with a plain
    # scramble, no secure channel needed. So we make ONE TLS connection per account at
    # setup time to prime the cache; the whole measured workload then runs over plaintext
    # TCP exactly like every other engine. TLS never touches the benchmark itself.
    image: mysql:latest
    container_name: mysql_container
    cpus: 4
    mem_limit: 8g
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      # Must not be `mysql` - that is MySQL's own system schema, which always holds the
      # grant tables, so HammerDB's TPC-C build refuses it as "exists but is not empty".
      # The entrypoint creates this database empty and grants MYSQL_USER on it, which is
      # what lets the non-root mysql user build the schema. TPC-H uses its own `tpch`
      # database (created by HammerDB as root) and BenchBase creates `benchbase` itself.
      MYSQL_DATABASE: tpcc
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    # ports:
      # - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Prime the caching_sha2_password cache for both accounts HammerDB uses (TPC-C runs
    # as `mysql`, TPC-H as `root`) so the benchmark itself can connect over plaintext.
    # These run right after `docker run` — before the healthcheck — hence the explicit
    # wait; they are setup, not a measured flow phase, so MySQL keeps the same phase
    # structure as every other engine. MYSQL_PWD avoids mysql's "password on the command
    # line is insecure" warning on stderr. No `$` anywhere: docker compose would
    # interpolate it (see the cockroach service). Takes ~8s from a cold container.
    setup-commands:
      - shell: bash
        command: |
          timeout 300 bash -c "until mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent >/dev/null 2>&1; do sleep 2; done"
          MYSQL_PWD=mysql mysql -h mysql_container --protocol=TCP -uroot --ssl-mode=REQUIRED -e "SELECT 1" >/dev/null
          MYSQL_PWD=mysql mysql -h mysql_container --protocol=TCP -umysql --ssl-mode=REQUIRED -e "SELECT 1" >/dev/null
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle_container
    cpus: 4
    mem_limit: 8g
    environment:
      ORACLE_PWD: oracle
    # ports:
      # - "1521:1521"
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
  mssql:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: mssql_container
    cpus: 4
    mem_limit: 8g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Hammerdb_2024
      MSSQL_PID: Developer
    # ports:
      # - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  db2:
    # The Db2 client side runs in the hammerdb container via the `hammerdb-db2`
    # image, which must be built first with `./db/db2/build-image.sh`.
    image: icr.io/db2_community/db2:latest
    container_name: db2_container
    cpus: 4
    mem_limit: 8g
    # Db2 creates its instance's System V IPC objects (shared memory +
    # semaphores) across UIDs during CREATE DATABASE, which needs CAP_IPC_OWNER.
    # That is the ONLY thing it actually needed from --privileged: tested, with
    # just this capability Db2 inits, CREATE DATABASE succeeds and connections
    # work; without it CREATE DATABASE fails (SQL1031N on connect). No --sysctl
    # or --ulimit is needed on a modern kernel (defaults already exceed Db2's
    # IPC minimums). If Db2 ever fails to start on a host with unusually low IPC
    # limits, add the specific --sysctl (e.g. kernel.sem / kernel.shmmax) here —
    # that is a resource ceiling, not performance tuning.
    docker-run-args:
      - "--cap-add IPC_OWNER"
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: ibmdb2
      DBNAME: tpcc # overridden to tpch in the TPC-H scenario
    # ports:
      # - "50000:50000"
    healthcheck:
      test: ["CMD-SHELL", "su -l db2inst1 -c \"db2 connect to $DBNAME && db2 connect reset\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  cockroach:
    # BenchBase-only engine: CockroachDB is PostgreSQL-wire compatible and is driven
    # through BenchBase's COCKROACHDB profile. Neither HammerDB benchmark can build a
    # schema on it (TPROC-C needs PL/pgSQL `ALIAS FOR $1`, TPROC-H adds a primary key
    # over a nullable column) — see the CockroachDB section in README.md.
    #
    # The node runs *secure* rather than the usual `start-single-node --insecure`: certs
    # are generated on first boot and a root password is set, so the engine is exercised
    # with real authentication like every other one here. --accept-sql-without-tls is
    # what makes that affordable — the SQL session still runs over plaintext TCP exactly
    # like the other engines, so the energy comparison is not skewed by TLS on a single
    # engine. The readiness flag written after the password is set is what the
    # healthcheck waits for, so a driver never connects before auth is usable.
    #
    # sql.conn.max_read_buffer_message_size is raised from its 16MiB default because
    # BenchBase's Wikipedia loader batches 128 rows of real article text into one INSERT
    # and overruns it, killing the load with "Batch entry 4 INSERT INTO text ...". This
    # is a wire-protocol ceiling, not a performance knob — the alternative would be to
    # shrink <batchsize> for CockroachDB alone, which check_repo.py rightly rejects
    # because it would make the workload different from every other engine's.
    image: cockroachdb/cockroach:latest
    container_name: cockroach_container
    cpus: 4
    mem_limit: 8g
    entrypoint: ["/bin/bash", "-c"]
    # No shell variables and no `$` anywhere in this script on purpose: docker compose
    # interpolates `$VAR` in compose files before the container ever sees it (an early
    # version of this used $CERTS and the node died with "the path to the certs
    # directory is required"). Escaping as `$$` is a compose-only convention that GMT's
    # own loader does not undo, so the literal paths are the portable option.
    command:
      - |
        set -eu
        /cockroach/cockroach cert create-ca --certs-dir=/tmp/certs --ca-key=/tmp/ca.key
        /cockroach/cockroach cert create-node localhost 127.0.0.1 cockroach_container --certs-dir=/tmp/certs --ca-key=/tmp/ca.key
        /cockroach/cockroach cert create-client root --certs-dir=/tmp/certs --ca-key=/tmp/ca.key
        /cockroach/cockroach start-single-node --certs-dir=/tmp/certs --accept-sql-without-tls --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 &
        until /cockroach/cockroach sql --certs-dir=/tmp/certs -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        /cockroach/cockroach sql --certs-dir=/tmp/certs -e "ALTER USER root WITH PASSWORD 'cockroach';"
        /cockroach/cockroach sql --certs-dir=/tmp/certs -e "SET CLUSTER SETTING sql.conn.max_read_buffer_message_size = '64MiB';"
        touch /tmp/cockroach-ready
        wait
    # ports:
      # - "26257:26257"
    healthcheck:
      # The flag file only appears after the root password is set, so a driver that
      # waits on service_healthy can authenticate immediately.
      test: ["CMD-SHELL", "test -f /tmp/cockroach-ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

# Benchmark drivers

  hammerdb:
    image: tpcorg/hammerdb:latest
    container_name: hammerdb_container

  benchbase:
    image: ribalba/benchbase:latest
    container_name: benchbase_container
