---
name: BenchBase Microsoft SQL Server CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Microsoft SQL Server with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  cockroach: # unused — empty key removes the service
  postgres: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      mssql:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: mssql_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Hammerdb_2024 -C -Q "IF DB_ID('benchbase') IS NULL CREATE DATABASE benchbase"
        shell: bash
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      # The loader, and only the loader, runs with useBulkCopyForBatchInsert: it makes the
      # Microsoft JDBC driver push batched INSERTs through the bulk-copy API, which cut the
      # YCSB load from 365 s to 128 s in a local A/B test. It is injected here rather than
      # kept in the config file so that it cannot reach the warm-up or the measured run,
      # whose single-statement transactions it could otherwise slow down.
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-sqlserver && sed 's#;</url>#;useBulkCopyForBatchInsert=true;</url>#' /tmp/repo/db/mssql/chbenchmark/mssql_chbenchmark_config.xml > /tmp/benchbase-load.xml && grep -q 'useBulkCopyForBatchInsert=true' /tmp/benchbase-load.xml && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/benchbase-load.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Warm up
    container: benchbase_container
    commands:
      # Warm-up is its own phase (same workload, 120 s) so that the measured phase
      # below holds only the 300 s steady-state window. The warm-up config is derived
      # from the measured one at run time; only <time> differs.
      - type: console
        note: BENCHBASE WARM-UP
        command: cd /benchbase/benchbase-sqlserver && sed 's#<time>300</time>#<time>120</time>#' /tmp/repo/db/mssql/chbenchmark/mssql_chbenchmark_config.xml > /tmp/benchbase-warmup.xml && grep -q '<time>120</time>' /tmp/benchbase-warmup.xml && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/benchbase-warmup.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-warmup.log; grep -q 'measuredRequests=' /tmp/benchbase-warmup.log
        shell: bash
        log-stdout: true
  - name: Run CH-benCHmark
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE CH-benCHmark (measured)
        command: cd /benchbase/benchbase-sqlserver && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/mssql/chbenchmark/mssql_chbenchmark_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; echo '=== BENCHBASE SUMMARY ==='; cat "$(ls -t results/*.summary.json | head -n 1)" || echo 'SUMMARY MISSING'; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 chbenchmark_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
