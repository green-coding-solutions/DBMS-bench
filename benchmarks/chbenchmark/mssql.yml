---
name: BenchBase Microsoft SQL Server CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin)
description: Benchmarks Microsoft SQL Server with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  postgres: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      mssql:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: mssql_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Hammerdb_2024 -C -Q "IF DB_ID('benchbase') IS NULL CREATE DATABASE benchbase"
        shell: sh
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-sqlserver && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/mssql/chbenchmark/mssql_chbenchmark_config.xml --create=true --load=true --execute=false
        shell: sh
        log-stdout: true
  - name: Run CH-benCHmark HTAP workload
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE
        command: cd /benchbase/benchbase-sqlserver && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/mssql/chbenchmark/mssql_chbenchmark_config.xml --create=false --load=false --execute=true | tee /dev/stderr | awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v!="") {printf("chbenchmark_requests=%s\n",v)}}'
        shell: sh
        log-stdout: true
        read-sci-stdout: true
