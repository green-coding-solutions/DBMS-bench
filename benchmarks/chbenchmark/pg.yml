---
name: BenchBase PostgreSQL CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks PostgreSQL with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  cockroach: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      postgres:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: postgres_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        # No `psql | grep` here: grep -q closes the pipe on the first match, which under
        # pipefail surfaces psql's SIGPIPE as a failed pipeline.
        command: if [ -z "$(psql "postgresql://postgres:postgres@localhost:5432/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='benchbase'")" ]; then psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE benchbase"; fi
        shell: bash
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/pg/chbenchmark/pg_chbenchmark_config.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Run CH-benCHmark HTAP workload
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE
        command: cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/pg/chbenchmark/pg_chbenchmark_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 chbenchmark_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
