---
name: BenchBase PostgreSQL CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks PostgreSQL with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  postgres:
    # PostgreSQL parallel workers pass hash-join batches through POSIX shared memory in /dev/shm,
    # which Docker limits to 64 MB by default. Under the tuned tiers the CH-benCHmark queries
    # exceeded it (Q15 never completed at T1 and T2: 'could not resize shared memory segment ...
    # No space left on device', 14 Sep 2026), so the container gets the 1 GB that the image's
    # documentation recommends. Same value on every tier of this cell.
    docker-run-args:
      - "--shm-size=1g"
    # T1: resource-sized, workload-blind. Server parameters as command-line
    # arguments so they are in force from the first start; provenance in TIERS.md.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2048MB"
      - "-c"
      - "effective_cache_size=6144MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "work_mem=13106kB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_maintenance_workers=2"
  cockroach: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      postgres:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: postgres_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T1, applied at container start through the command line above)
        command: psql -U postgres -v ON_ERROR_STOP=1 -Atf /tmp/repo/db/pg/tiers/configure.sql
        shell: bash
        log-stdout: true
  - name: Create benchbase database
    container: postgres_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        # No `psql | grep` here: grep -q closes the pipe on the first match, which under
        # pipefail surfaces psql's SIGPIPE as a failed pipeline.
        command: if [ -z "$(psql "postgresql://postgres:postgres@localhost:5432/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='benchbase'")" ]; then psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE benchbase"; fi
        shell: bash
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/pg/chbenchmark/pg_chbenchmark_config.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Refresh optimizer statistics
    container: postgres_container
    commands:
      # The BenchBase loader does not analyze the tables it fills, so the planner statistics
      # come from autovacuum, which samples the tables while the load is still running. A
      # sample taken while order_line was empty made the planner scan order_line by warehouse
      # and district only (40 rows estimated, 30,000 present) in Q10 and Q18, and the warm-up
      # waited 73 to 88 min for that query on machine 13 (16 Sep 2026). Refreshing the
      # statistics after the load is what a DBA does after a bulk load and what the HammerDB
      # scenarios already do (pg_vacuum). Outside the measured phase; same on every tier.
      - type: console
        note: ANALYZE AFTER LOAD
        command: psql -U postgres -d benchbase -c "ANALYZE"
        shell: bash
        log-stdout: true
  - name: Warm up
    container: benchbase_container
    commands:
      # Warm-up is its own phase (same workload, 120 s) so that the measured phase
      # below holds only the 300 s steady-state window. The warm-up config is derived
      # from the measured one at run time; only <time> differs.
      - type: console
        note: BENCHBASE WARM-UP
        command: cd /benchbase/benchbase-postgres && sed 's#<time>300</time>#<time>120</time>#' /tmp/repo/db/pg/chbenchmark/pg_chbenchmark_config.xml > /tmp/benchbase-warmup.xml && grep -q '<time>120</time>' /tmp/benchbase-warmup.xml && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/benchbase-warmup.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-warmup.log; grep -q 'measuredRequests=' /tmp/benchbase-warmup.log
        shell: bash
        log-stdout: true
  - name: Run CH-benCHmark
    container: benchbase_container
    commands:
      - type: console
        # After the run the step prints the summary JSON and a per-transaction-type latency
        # table computed from BenchBase's raw.csv (every request recorded inside the measured
        # window, whatever its outcome): count, mean and nearest-rank p50/p95/p99/max in ms. The
        # OLTP and OLAP parts of the hybrid workload are curated separately from it (14 Sep 2026).
        note: BENCHBASE EXECUTE CH-benCHmark (measured)
        command: cd /benchbase/benchbase-postgres && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/pg/chbenchmark/pg_chbenchmark_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; echo '=== BENCHBASE SUMMARY ==='; cat "$(ls -t results/*.summary.json | head -n 1)" || echo 'SUMMARY MISSING'; echo '=== BENCHBASE PER-TYPE LATENCY ==='; echo 'type,count,mean_ms,p50_ms,p95_ms,p99_ms,max_ms'; { f="$(ls -t results/*.raw.csv 2>/dev/null | head -n 1)" && [ -n "$f" ] && tail -n +2 "$f" | sort -t, -k2,2 -k4,4n | awk -F, 'function out() { i50=int(0.5*n); if (i50<0.5*n) i50++; i95=int(0.95*n); if (i95<0.95*n) i95++; i99=int(0.99*n); if (i99<0.99*n) i99++; printf("%s,%d,%.3f,%.3f,%.3f,%.3f,%.3f\n", cur, n, s/n/1000, v[i50]/1000, v[i95]/1000, v[i99]/1000, v[n]/1000) } $2 != cur { if (n) out(); cur=$2; n=0; s=0; split("", v) } { n++; s+=$4; v[n]=$4 } END { if (n) out() }' && tail -n +2 "$f" | awk -F, '{ c="OLTP"; if ($2 ~ /^Q[0-9]+$/) c="OLAP"; print c "," $4 }' | sort -t, -k1,1 -k2,2n | awk -F, 'function out() { i50=int(0.5*n); if (i50<0.5*n) i50++; i95=int(0.95*n); if (i95<0.95*n) i95++; i99=int(0.99*n); if (i99<0.99*n) i99++; printf("%s,%d,%.3f,%.3f,%.3f,%.3f,%.3f\n", cur, n, s/n/1000, v[i50]/1000, v[i95]/1000, v[i99]/1000, v[n]/1000) } $1 != cur { if (n) out(); cur=$1; n=0; s=0; split("", v) } { n++; s+=$2; v[n]=$2 } END { if (n) out() }'; } || echo 'PER-TYPE MISSING'; echo '=== END PER-TYPE LATENCY ==='; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 chbenchmark_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
