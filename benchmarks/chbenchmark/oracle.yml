---
name: BenchBase Oracle Database Free CH-benCHmark benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Oracle Database Free with BenchBase using CH-benCHmark (HTAP — concurrent TPC-C and TPC-H)

compose-file: !include compose.yml

custom_metrics:
  chbenchmark_requests: # functional unit (work done): BenchBase requests completed (OLTP txns + OLAP queries) in the measured run
    unit: CH-benCHmark request
    sci: true

services:
  cockroach: # unused — empty key removes the service
  postgres: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      oracle:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: oracle_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T1, applied here)
        command: sqlplus -s -L / as sysdba @/tmp/repo/db/oracle/tiers/t1.sql; for i in $(seq 1 60); do echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1 && break; sleep 2; done; echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1 && echo 'FREEPDB1 reachable through the listener'
        shell: bash
        log-stdout: true
  - name: Create benchbase database
    container: oracle_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: printf '%s\n' "WHENEVER SQLERROR EXIT FAILURE" "CREATE USER benchbase IDENTIFIED BY benchbase DEFAULT TABLESPACE users QUOTA UNLIMITED ON users;" "GRANT CONNECT, RESOURCE, CREATE VIEW TO benchbase;" "EXIT;" | sqlplus -s system/oracle@//localhost:1521/FREEPDB1
        shell: bash
        log-stdout: true
  - name: Load CH-benCHmark schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD (TPC-C + CH tables)
        command: cd /benchbase/benchbase-oracle && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/oracle/chbenchmark/oracle_chbenchmark_config.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Warm up
    container: benchbase_container
    commands:
      # Warm-up is its own phase (same workload, 120 s) so that the measured phase
      # below holds only the 300 s steady-state window. The warm-up config is derived
      # from the measured one at run time; only <time> differs.
      - type: console
        note: BENCHBASE WARM-UP
        command: cd /benchbase/benchbase-oracle && sed 's#<time>300</time>#<time>120</time>#' /tmp/repo/db/oracle/chbenchmark/oracle_chbenchmark_config.xml > /tmp/benchbase-warmup.xml && grep -q '<time>120</time>' /tmp/benchbase-warmup.xml && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/benchbase-warmup.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-warmup.log; grep -q 'measuredRequests=' /tmp/benchbase-warmup.log
        shell: bash
        log-stdout: true
  - name: Run CH-benCHmark
    container: benchbase_container
    commands:
      - type: console
        # After the run the step prints the summary JSON and a per-transaction-type latency
        # table computed from BenchBase's raw.csv (every request recorded inside the measured
        # window, whatever its outcome): count, mean and nearest-rank p50/p95/p99/max in ms. The
        # OLTP and OLAP parts of the hybrid workload are curated separately from it (14 Sep 2026).
        note: BENCHBASE EXECUTE CH-benCHmark (measured)
        command: cd /benchbase/benchbase-oracle && java -jar benchbase.jar -b tpcc,chbenchmark -c /tmp/repo/db/oracle/chbenchmark/oracle_chbenchmark_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; echo '=== BENCHBASE SUMMARY ==='; cat "$(ls -t results/*.summary.json | head -n 1)" || echo 'SUMMARY MISSING'; echo '=== BENCHBASE PER-TYPE LATENCY ==='; echo 'type,count,mean_ms,p50_ms,p95_ms,p99_ms,max_ms'; { f="$(ls -t results/*.raw.csv 2>/dev/null | head -n 1)" && [ -n "$f" ] && tail -n +2 "$f" | sort -t, -k2,2 -k4,4n | awk -F, 'function out() { i50=int(0.5*n); if (i50<0.5*n) i50++; i95=int(0.95*n); if (i95<0.95*n) i95++; i99=int(0.99*n); if (i99<0.99*n) i99++; printf("%s,%d,%.3f,%.3f,%.3f,%.3f,%.3f\n", cur, n, s/n/1000, v[i50]/1000, v[i95]/1000, v[i99]/1000, v[n]/1000) } $2 != cur { if (n) out(); cur=$2; n=0; s=0; split("", v) } { n++; s+=$4; v[n]=$4 } END { if (n) out() }' && tail -n +2 "$f" | awk -F, '{ c="OLTP"; if ($2 ~ /^Q[0-9]+$/) c="OLAP"; print c "," $4 }' | sort -t, -k1,1 -k2,2n | awk -F, 'function out() { i50=int(0.5*n); if (i50<0.5*n) i50++; i95=int(0.95*n); if (i95<0.95*n) i95++; i99=int(0.99*n); if (i99<0.99*n) i99++; printf("%s,%d,%.3f,%.3f,%.3f,%.3f,%.3f\n", cur, n, s/n/1000, v[i50]/1000, v[i95]/1000, v[i99]/1000, v[n]/1000) } $1 != cur { if (n) out(); cur=$1; n=0; s=0; split("", v) } { n++; s+=$2; v[n]=$2 } END { if (n) out() }'; } || echo 'PER-TYPE MISSING'; echo '=== END PER-TYPE LATENCY ==='; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 chbenchmark_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
