---
name: BenchBase Oracle Database Free Wikipedia benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Oracle Database Free with BenchBase using the Wikipedia workload

compose-file: !include compose.yml

custom_metrics:
  wikipedia_requests: # functional unit (work done): BenchBase requests completed in the measured run
    unit: Wikipedia request
    sci: true

services:
  cockroach: # unused — empty key removes the service
  postgres: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  mssql: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      oracle:
        condition: service_healthy

flow:
  - name: Create benchbase database
    container: oracle_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: printf '%s\n' "WHENEVER SQLERROR EXIT FAILURE" "CREATE USER benchbase IDENTIFIED BY benchbase DEFAULT TABLESPACE users QUOTA UNLIMITED ON users;" "GRANT CONNECT, RESOURCE, CREATE VIEW TO benchbase;" "EXIT;" | sqlplus -s system/oracle@//localhost:1521/FREEPDB1
        shell: bash
        log-stdout: true
  - name: Load Wikipedia schema and data
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE CREATE + LOAD
        command: cd /benchbase/benchbase-oracle && java -jar benchbase.jar -b wikipedia -c /tmp/repo/db/oracle/wikipedia/oracle_wikipedia_config.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Warm up
    container: benchbase_container
    commands:
      # Warm-up is its own phase (same workload, 120 s) so that the measured phase
      # below holds only the 300 s steady-state window. The warm-up config is derived
      # from the measured one at run time; only <time> differs.
      - type: console
        note: BENCHBASE WARM-UP
        command: cd /benchbase/benchbase-oracle && sed 's#<time>300</time>#<time>120</time>#' /tmp/repo/db/oracle/wikipedia/oracle_wikipedia_config.xml > /tmp/benchbase-warmup.xml && grep -q '<time>120</time>' /tmp/benchbase-warmup.xml && java -jar benchbase.jar -b wikipedia -c /tmp/benchbase-warmup.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-warmup.log; grep -q 'measuredRequests=' /tmp/benchbase-warmup.log
        shell: bash
        log-stdout: true
  - name: Run Wikipedia
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE Wikipedia (measured)
        command: cd /benchbase/benchbase-oracle && java -jar benchbase.jar -b wikipedia -c /tmp/repo/db/oracle/wikipedia/oracle_wikipedia_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; echo '=== BENCHBASE SUMMARY ==='; cat "$(ls -t results/*.summary.json | head -n 1)" || echo 'SUMMARY MISSING'; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 wikipedia_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
