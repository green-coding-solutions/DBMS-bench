---
name: BenchBase Microsoft SQL Server Wikipedia benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Microsoft SQL Server with BenchBase using the Wikipedia workload

compose-file: !include compose.yml

custom_metrics:
  wikipedia_requests: # functional unit (work done): BenchBase requests completed in the measured run
    unit: Wikipedia request
    sci: true

services:
  cockroach: # unused — empty key removes the service
  postgres: # unused — empty key removes the service
  mariadb: # unused — empty key removes the service
  mysql: # unused — empty key removes the service
  oracle: # unused — empty key removes the service
  db2: # unused — empty key removes the service
  hammerdb: # unused — empty key removes the service
  benchbase: # load driver; wait for the database to be healthy first
    depends_on:
      mssql:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: mssql_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T1, applied here)
        command: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Hammerdb_2024 -C -b -W -h -1 -i /tmp/repo/db/mssql/tiers/t1.sql
        shell: bash
        log-stdout: true
  - name: Create benchbase database
    container: mssql_container
    commands:
      - type: console
        note: CREATE BENCHBASE DATABASE
        command: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Hammerdb_2024 -C -Q "IF DB_ID('benchbase') IS NULL CREATE DATABASE benchbase"
        shell: bash
        log-stdout: true
  - name: Load Wikipedia schema and data
    container: benchbase_container
    commands:
      # This loader keeps the plain JDBC URL, unlike the YCSB and CH-benCHmark ones. The
      # Wikipedia schema for SQL Server has six IDENTITY columns and BenchBase loads them
      # under SET IDENTITY_INSERT ON, supplying the key itself. useBulkCopyForBatchInsert
      # cannot honour that: mssql-jdbc 11.2.3 builds its SQLServerBulkCopy with the default
      # keepIdentity=false and offers no connection property to change it, so the load dies
      # on error 545 ("Explicit value must be specified for identity column in table
      # 'useracct'"). The load step is unmeasured, so only its wall clock is affected.
      - type: console
        note: BENCHBASE CREATE + LOAD
        command: cd /benchbase/benchbase-sqlserver && java -jar benchbase.jar -b wikipedia -c /tmp/repo/db/mssql/wikipedia/mssql_wikipedia_config.xml --create=true --load=true --execute=false
        shell: bash
        log-stdout: true
  - name: Warm up
    container: benchbase_container
    commands:
      # Warm-up is its own phase (same workload, 120 s) so that the measured phase
      # below holds only the 300 s steady-state window. The warm-up config is derived
      # from the measured one at run time; only <time> differs.
      - type: console
        note: BENCHBASE WARM-UP
        command: cd /benchbase/benchbase-sqlserver && sed 's#<time>300</time>#<time>120</time>#' /tmp/repo/db/mssql/wikipedia/mssql_wikipedia_config.xml > /tmp/benchbase-warmup.xml && grep -q '<time>120</time>' /tmp/benchbase-warmup.xml && java -jar benchbase.jar -b wikipedia -c /tmp/benchbase-warmup.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-warmup.log; grep -q 'measuredRequests=' /tmp/benchbase-warmup.log
        shell: bash
        log-stdout: true
  - name: Run Wikipedia
    container: benchbase_container
    commands:
      - type: console
        note: BENCHBASE EXECUTE Wikipedia (measured)
        command: cd /benchbase/benchbase-sqlserver && java -jar benchbase.jar -b wikipedia -c /tmp/repo/db/mssql/wikipedia/mssql_wikipedia_config.xml --create=false --load=false --execute=true 2>&1 | tee /tmp/benchbase-run.log; echo '=== BENCHBASE SUMMARY ==='; cat "$(ls -t results/*.summary.json | head -n 1)" || echo 'SUMMARY MISSING'; awk 'match($0,/measuredRequests=[0-9]+/) {v=substr($0,RSTART+17,RLENGTH-17)} END {if (v=="") exit 1; "date +%s"|getline ts; printf("%s000000 wikipedia_requests=%s\n", ts, v)}' /tmp/benchbase-run.log
        shell: bash
        log-stdout: true
        read-sci-stdout: true
