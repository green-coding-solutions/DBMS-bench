---
name: HammerDB Oracle TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Oracle Database Free with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  cockroach: # unused — empty key removes the service
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  benchbase: # unused BenchBase driver removed so no idle container is measured
  hammerdb: # wait for Oracle to finish starting up before benchmarking
    depends_on:
      oracle:
        condition: service_healthy
    # the Oracle Instant Client ships in the hammerdb image but its dir is not on
    # the loader path, so libclntsh.so can't find libnnz21.so / libclntshcore.so
    environment:
      LD_LIBRARY_PATH: /home/instantclient_21_18

flow:
  - name: Configure DBMS
    container: oracle_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T2 olap, applied here)
        command: sqlplus -s -L / as sysdba @/tmp/repo/db/oracle/tiers/t2_olap.sql; for i in $(seq 1 60); do echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1 && break; sleep 2; done; echo 'SELECT 1 FROM dual;' | sqlplus -s -L system/oracle@//localhost:1521/FREEPDB1 | grep -qw 1 && echo 'FREEPDB1 reachable through the listener'
        shell: bash
        log-stdout: true
  - name: Build Schema
    container: hammerdb_container
    commands:
      # HammerDB exits 0 even when a virtual user dies mid-run, so the log is the only
      # place that failure shows up. Nothing else needs handling: GMT runs the shell
      # with errexit/nounset/pipefail and reports stdout/stderr when a command fails.
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_buildschema.tcl 2>&1 | tee /tmp/hammerdb-build.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Run TPC-H
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_run.tcl 2>&1 | tee /tmp/hammerdb-run.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi; printf '%s000000 tpch_queries=22\n' "$(date +%s)"
        shell: bash
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_deleteschema.tcl
        shell: bash
        log-stdout: true
