---
name: HammerDB Oracle TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin)
description: Benchmarks Oracle Database Free with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  hammerdb: # wait for Oracle to finish starting up before benchmarking
    depends_on:
      oracle:
        condition: service_healthy
    # the Oracle Instant Client ships in the hammerdb image but its dir is not on
    # the loader path, so libclntsh.so can't find libnnz21.so / libclntshcore.so
    environment:
      LD_LIBRARY_PATH: /home/instantclient_21_18

flow:
  - name: Build Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_buildschema.tcl | tee /dev/stderr | awk '/query [0-9]+ completed in/{q++} END{if(q>0){printf("tpch_queries=%d\n",q)}}'
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Run Queries
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_run.tcl | tee /dev/stderr | awk '/query [0-9]+ completed in/{q++} END{if(q>0){printf("tpch_queries=%d\n",q)}}'
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/oracle/tpch/oracle_tproch_deleteschema.tcl | tee /dev/stderr | awk '/query [0-9]+ completed in/{q++} END{if(q>0){printf("tpch_queries=%d\n",q)}}'
        shell: sh
        log-stdout: true
        read-sci-stdout: true
