---
name: HammerDB MSSQL TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks Microsoft SQL Server with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  oracle: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  hammerdb: # wait for SQL Server to finish starting up before benchmarking
    depends_on:
      mssql:
        condition: service_healthy

flow:
  - name: Build Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/mssql/tpch/mssql_tproch_buildschema.tcl
        shell: sh
        log-stdout: true
  - name: Run Queries
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: ./hammerdbcli auto /tmp/repo/db/mssql/tpch/mssql_tproch_run.tcl > /tmp/hammerdb-run.log 2>&1; rc=$?; cat /tmp/hammerdb-run.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; printf '%s000000 tpch_queries=22\n' "$(date +%s)"
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/mssql/tpch/mssql_tproch_deleteschema.tcl
        shell: sh
        log-stdout: true
