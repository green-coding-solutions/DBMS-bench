---
name: HammerDB MySQL TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks mysql with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  oracle: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  hammerdb: # wait for MySQL to finish starting up before benchmarking
    depends_on:
      mysql:
        condition: service_healthy

flow:
  - name: Build Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB BUILD
        command: rc=0; ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_buildschema.tcl > /tmp/hammerdb-build.log 2>&1 || rc=$?; cat /tmp/hammerdb-build.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see log above' >&2; exit 1; fi
        shell: sh
        log-stdout: true
  - name: Run Queries
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: rc=0; ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_run.tcl > /tmp/hammerdb-run.log 2>&1 || rc=$?; cat /tmp/hammerdb-run.log >&2; [ "$rc" -eq 0 ] || exit "$rc"; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see log above' >&2; exit 1; fi; printf '%s000000 tpch_queries=22\n' "$(date +%s)"
        shell: sh
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_deleteschema.tcl
        shell: sh
        log-stdout: true
