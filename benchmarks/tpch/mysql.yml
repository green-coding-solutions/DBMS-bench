---
name: HammerDB MySQL TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks mysql with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  mysql:
    # T2: workload-tuned for throughput, class olap. Server parameters as command-line
    # arguments so they are in force from the first start; provenance in TIERS.md.
    command:
      - "--innodb-buffer-pool-size=6144M"
      - "--innodb-redo-log-capacity=2G"
      - "--innodb-buffer-pool-instances=4"
      - "--innodb-page-cleaners=4"
      - "--innodb-purge-threads=4"
      - "--innodb-log-buffer-size=64M"
      - "--innodb-io-capacity=4000"
      - "--innodb-io-capacity-max=20000"
      - "--innodb-change-buffering=none"
      - "--innodb-adaptive-hash-index=OFF"
      - "--innodb-spin-wait-delay=6"
      - "--innodb-flush-method=O_DIRECT"
  cockroach: # unused — empty key removes the service
  postgres: # empty key will remove the unused service
  mariadb: # empty key will remove the unused service
  oracle: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  benchbase: # unused BenchBase driver removed so no idle container is measured
  hammerdb: # wait for MySQL to finish starting up before benchmarking
    depends_on:
      mysql:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: mysql_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T2 olap, applied at container start through the command line above)
        command: MYSQL_PWD=mysql mysql -uroot --skip-column-names < /tmp/repo/db/mysql/tiers/configure.sql
        shell: bash
        log-stdout: true
  - name: Build Schema
    container: hammerdb_container
    commands:
      # HammerDB exits 0 even when a virtual user dies mid-run, so the log is the only
      # place that failure shows up. Nothing else needs handling: GMT runs the shell
      # with errexit/nounset/pipefail and reports stdout/stderr when a command fails.
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_buildschema.tcl 2>&1 | tee /tmp/hammerdb-build.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Run TPC-H
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_run.tcl 2>&1 | tee /tmp/hammerdb-run.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi; printf '%s000000 tpch_queries=22\n' "$(date +%s)"
        shell: bash
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/mysql/tpch/mysql_tproch_deleteschema.tcl
        shell: bash
        log-stdout: true
