---
name: HammerDB MariaDB TPC-H benchmark
author: Didi Hoffmann <didi@green-coding.berlin>
description: Benchmarks mariadb with HammerDB using TPC-H

compose-file: !include compose.yml

custom_metrics:
  tpch_queries: # functional unit (work done): number of TPC-H queries completed
    unit: TPC-H query
    sci: true

services:
  mariadb:
    # T1: resource-sized, workload-blind. Server parameters as command-line
    # arguments so they are in force from the first start; provenance in TIERS.md.
    command:
      - "--innodb-buffer-pool-size=6144M"
      - "--innodb-log-file-size=2G"
  cockroach: # unused — empty key removes the service
  postgres: # empty key will remove the unused service
  mysql: # empty key will remove the unused service
  oracle: # empty key will remove the unused service
  mssql: # empty key will remove the unused service
  db2: # empty key will remove the unused service
  benchbase: # unused BenchBase driver removed so no idle container is measured
  hammerdb: # wait for MariaDB to finish starting up before benchmarking
    depends_on:
      mariadb:
        condition: service_healthy

flow:
  - name: Configure DBMS
    container: mariadb_container
    commands:
      # Paper tier branch: prints CONFIG <name>=<value> for every parameter any tier
      # touches, then the full effective configuration, so the run log proves the tier
      # took effect. Outside the measured phase; see TIERS.md.
      - type: console
        note: CONFIGURE DBMS (T1, applied at container start through the command line above)
        command: mariadb -uroot -pmaria --skip-column-names < /tmp/repo/db/maria/tiers/configure.sql
        shell: bash
        log-stdout: true
  - name: Build Schema
    container: hammerdb_container
    commands:
      # HammerDB exits 0 even when a virtual user dies mid-run, so the log is the only
      # place that failure shows up. Nothing else needs handling: GMT runs the shell
      # with errexit/nounset/pipefail and reports stdout/stderr when a command fails.
      - type: console
        note: RUN HAMMERDB BUILD
        command: ./hammerdbcli auto /tmp/repo/db/maria/tpch/maria_tproch_buildschema.tcl 2>&1 | tee /tmp/hammerdb-build.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-build.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi
        shell: bash
        log-stdout: true
  - name: Run TPC-H
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB QUERIES
        command: ./hammerdbcli auto /tmp/repo/db/maria/tpch/maria_tproch_run.tcl 2>&1 | tee /tmp/hammerdb-run.log; if grep -qE 'FINISHED FAILED|Error in Virtual User' /tmp/hammerdb-run.log; then echo 'HammerDB reported virtual-user failures - see the log above' >&2; exit 1; fi; printf '%s000000 tpch_queries=22\n' "$(date +%s)"
        shell: bash
        log-stdout: true
        read-sci-stdout: true
  - name: Drop Schema
    container: hammerdb_container
    commands:
      - type: console
        note: RUN HAMMERDB DROP
        command: ./hammerdbcli auto /tmp/repo/db/maria/tpch/maria_tproch_deleteschema.tcl
        shell: bash
        log-stdout: true
