# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Every image in compose.yml is on a floating tag now, so the docker-compose block
# below is deliberately near-idle: the runs are scheduled weekly in the GMT watchlist,
# GMT re-pulls each tag per run, and it records the resolved image plus the installed
# packages with the measurement — the version under test is captured in the run rather
# than pinned in this repo. The block is kept so that anything re-pinned later is still
# tracked automatically without having to remember to re-add it here.
version: 2
updates:
  - package-ecosystem: "docker-compose" # See documentation for possible values
    # GMT refuses to `!include` a compose file from a parent directory, so every
    # benchmark folder carries a byte-for-byte copy of the root compose.yml and
    # check_repo.py enforces that they stay identical. Dependabot therefore has to
    # see all six manifests, otherwise it bumps an image in the root copy only and
    # silently breaks that invariant.
    directories: # Locations of the package manifests
      - "/"
      - "/benchmarks/tpcc"
      - "/benchmarks/tpch"
      - "/benchmarks/wikipedia"
      - "/benchmarks/ycsb"
      - "/benchmarks/chbenchmark"
    groups:
      # One PR per image that bumps all six copies together, instead of six PRs
      # that each leave the copies out of sync until the last one merges.
      compose-copies:
        group-by: "dependency-name"
    schedule:
      interval: "weekly"

  # The BenchBase driver image is the one thing still pinned on purpose: its build
  # needs a JDK that google-java-format can run on, and eclipse-temurin:latest (25+)
  # breaks the Maven build outright. Patch/minor bumps inside the 23 line are welcome,
  # a major bump is not — so it is ignored here and has to be a deliberate change.
  - package-ecosystem: "docker"
    directory: "/benchmarks/benchbase"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
